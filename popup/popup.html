<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <img src="../icons/icon48.png" width="28" height="28" alt="" class="popup-icon">
      <div class="popup-header-text">
        <h1>小红书下载助手</h1>
        <span id="app-version" class="popup-version"></span>
      </div>
    </header>

    <main class="popup-body">
      <div id="state-loading">
        <div class="popup-detect loading">
          <span class="popup-dot pulse"></span>
          <span>正在识别页面…</span>
        </div>
        <div class="popup-video-card is-loading">
          <div class="popup-cover-wrap">
            <div class="popup-sk-cover popup-shimmer"></div>
          </div>
          <div class="popup-video-meta">
            <div class="popup-video-sk">
              <span class="popup-sk-line popup-shimmer"></span>
              <span class="popup-sk-line popup-shimmer short"></span>
              <span class="popup-sk-line popup-shimmer shorter"></span>
            </div>
          </div>
        </div>
      </div>

      <div id="state-video" class="hidden">
        <div class="popup-video-card">
          <div class="popup-cover-wrap">
            <img id="video-cover" class="popup-cover hidden" alt="">
            <div id="video-cover-ph" class="popup-cover-ph">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
          <div class="popup-video-meta">
            <div id="video-title" class="video-title"></div>
            <div id="video-author" class="video-author hidden"></div>
            <div id="video-sub" class="video-sub"></div>
          </div>
        </div>

        <ul class="popup-tips compact">
          <li>实际保存请点页面右下角悬浮按钮</li>
          <li>内容分为图片、视频、文字三类</li>
          <li>仅保存当前详情页已经加载的公开内容</li>
          <li>使用问题？<a id="popup-faq-link" href="../docs/faq.html" target="_blank" rel="noopener">查看常见问题</a></li>
        </ul>

        <button id="btn-open-panel" type="button" class="popup-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          打开下载面板
        </button>
      </div>

      <div id="state-empty" class="hidden">
        <div class="popup-detect warn">
          <span class="popup-dot warn"></span>
          <span>未识别到笔记详情页</span>
        </div>
        <div class="popup-empty-hero">
          <div class="popup-empty-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="3"/>
              <path d="M8 9h8M8 13h5"/>
            </svg>
          </div>
          <p class="popup-empty-title">请先打开一篇小红书笔记</p>
          <p class="popup-empty-lead">进入笔记详情页后按 F5，再点右下角悬浮按钮保存图片、视频或文字。</p>
          <p id="empty-current-site" class="popup-empty-site">当前页面：—</p>
        </div>
        <div class="popup-steps">
          <div class="popup-step">
            <span class="popup-step-num">1</span>
            <span class="popup-step-text">打开一篇公开笔记详情</span>
          </div>
          <div class="popup-step">
            <span class="popup-step-num">2</span>
            <span class="popup-step-text">点击页面右下角悬浮按钮</span>
          </div>
          <div class="popup-step">
            <span class="popup-step-num">3</span>
            <span class="popup-step-text">按图片 / 视频 / 文字分类保存</span>
          </div>
        </div>
        <div class="popup-feature-tags">
          <span class="popup-feature-tag">图片</span>
          <span class="popup-feature-tag">视频</span>
          <span class="popup-feature-tag">文字</span>
        </div>
        <a id="btn-go-xhs" class="popup-btn" href="https://www.xiaohongshu.com/explore" target="_blank" rel="noopener">
          打开小红书
        </a>
      </div>

      <div id="state-error" class="hidden">
        <div class="popup-detect error">
          <span class="popup-dot error"></span>
          <span id="error-text">加载失败</span>
        </div>
        <div class="popup-empty-hero compact">
          <p class="popup-empty-title">暂时无法读取笔记信息</p>
          <p class="popup-error-hint">请在笔记详情页按 F5 刷新后，再点击扩展图标。</p>
        </div>
        <button id="btn-retry" type="button" class="popup-btn popup-btn-outline">刷新并重试</button>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
